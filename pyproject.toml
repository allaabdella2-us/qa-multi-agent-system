[project]
# Distribution name is `qaas-python` (`qaas` was taken); the import package and
# the CLI are both `qaas`.
name = "qaas-python"
version = "0.4.1"
description = "A multi-agent QA system: finds real defects, reproduces them, files tickets, fixes them, and proves the fix"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Alla Abdella" }]
keywords = ["qa", "testing", "multi-agent", "agents", "claude", "llm", "bug-finding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "claude-agent-sdk>=0.2.127",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # typer>=0.16 is not cosmetic: click 8.2 changed Parameter.make_metavar()
    # to require a ctx argument, and typer 0.15 calls it without one. The pair
    # `typer 0.15.3` + `click 8.2.0` resolves happily and then crashes on
    # `qaas <command> --help` with a TypeError -- which is how a user found it,
    # on a package installed from PyPI.
    "typer>=0.16",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
qaas = "qaas.cli:app"

[project.urls]
Homepage = "https://github.com/allaabdella2-us/qa-multi-agent-system"
Repository = "https://github.com/allaabdella2-us/qa-multi-agent-system"
Issues = "https://github.com/allaabdella2-us/qa-multi-agent-system/issues"
Changelog = "https://github.com/allaabdella2-us/qa-multi-agent-system/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Non-.py files under this tree ship too, which is how prompts/ already reaches
# users and how skills/ and defaults/ will.
packages = ["src/qaas"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
# The sdist carries the calibration corpus (target-app/ + its golden ledger) so a
# contributor can run `qaas score`. The wheel does not: it is 69M, and it is a
# deliberately vulnerable application that has no business in site-packages.
include = [
    # Skills are NOT listed: they live inside the package now
    # (src/qaas/plugin/skills), so "src/" already carries them. The old
    # ".claude/skills/" entry outlived the directory it named -- hatchling
    # ignores a missing path, so it broke nothing and simply misled.
    "src/", "config/", "target-app/", "tests/",
    "README.md", "LICENSE", "ARCHITECTURE.md", "CLAUDE.md", "BUILD_PLAN.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "llm: test makes real Claude API calls (costs money)",
    "docker: test needs a Docker daemon and the target app running",
    "github: test talks to a real GitHub repository over the network",
    "jira: test talks to a real Jira instance (needs JIRA_* credentials)",
]
addopts = "-m 'not llm and not docker and not github and not jira'"

[tool.uv]
package = true
