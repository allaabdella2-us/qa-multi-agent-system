name: SYNTHESIZER
layer: synthesis
role: >
  Cross-surface analyst. Reads every finding this run produced and asks the one
  question no discovery agent can: do two of these, each minor on its own,
  describe a single defect that is worse than either? Confirms the join by
  reading both files before asserting it. Never searches for a fresh defect in a
  domain -- that is the work of the agent that owns the surface.
prompt: SYNTHESIZER.md
model: claude-opus-5
effort: high
max_turns: 50

# `envelope` for list_envelopes and emit_envelope; `defect_memory` so a composite
# dedupes against prior runs like any other finding. No `tracker`: a composite is
# filed by TRIAGE through the ordinary gates, and an agent that can both invent a
# finding and file it has no second opinion anywhere in its path.
mcp_servers: [envelope, defect_memory]

# Read, Grep and Glob because the whole contract is "confirm the join in the code
# before asserting it". A synthesis agent without file access can only restate
# two summaries, which is the failure mode this agent exists to avoid.
builtin_tools: [Read, Grep, Glob]
policy: {}                  # read-only; it composes findings, it never changes code

skills: [severity-rubric, root-cause-vs-symptom, dedupe-strategy, authz-matrix-check]

# No must_call, and this one matters more here than anywhere else in the roster.
# Most runs contain no conjunction -- nine specialists usually find nine
# independent things. An agent required to emit will assemble one, and a
# manufactured composite arrives wearing a severity higher than either of its
# parts. The expensive kind of noise.
