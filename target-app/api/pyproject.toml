[project]
name = "corvid-orders-api"
version = "1.0.0"
description = "Corvid Orders API — order and invoice management for small organizations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
