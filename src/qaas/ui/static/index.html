<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qaas — mission control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦‍⬛</text></svg>">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="bird">🐦‍⬛</span><span class="wordmark">qaas</span></div>
  <div class="run-id" id="run-id">—</div>
  <div class="target" id="target">—</div>
  <div class="mode" id="mode">—</div>
  <nav class="views" id="views">
    <button data-view="runs" class="on"><svg class="i"><use href="#i-runs"/></svg>runs</button>
    <button data-view="config"><svg class="i"><use href="#i-config"/></svg>configuration</button>
  </nav>
  <div class="spacer"></div>
  <div class="status" id="status"><span class="dot"></span><span id="status-text">—</span></div>
  <div class="clock">
    <div class="clock-row"><span id="elapsed">0:00</span><span class="of" id="cap">—</span></div>
    <div class="meter"><div class="meter-fill" id="clock-fill"></div></div>
  </div>
  <div class="cost"><span id="cost">$0.00</span><small>spent</small></div>
</header>

<main class="grid" id="grid-main">

  <aside class="rail" id="rail">
    <h2>runs</h2>
    <div id="run-list"></div>
  </aside>

  <section class="stage">

    <div class="phases" id="phases"></div>

    <div class="counters" id="counters"></div>

    <h2 class="section-title">agents <span class="hint" id="agent-hint"></span></h2>
    <div class="agent-bands" id="agents"></div>

    <h2 class="section-title">timeline</h2>
    <div class="timeline-wrap"><svg id="timeline" role="img" aria-label="agent timeline"></svg></div>

    <nav class="tabs" id="tabs">
      <button data-tab="findings" class="on">findings <b id="n-findings">0</b></button>
      <button data-tab="guardrails">guardrails <b id="n-denials">0</b></button>
      <button data-tab="tickets">tickets <b id="n-tickets">0</b></button>
      <button data-tab="escalations">escalations <b id="n-escalations">0</b></button>
      <button data-tab="artifacts">artifacts <b id="n-artifacts">0</b></button>
      <button data-tab="score">score</button>
    </nav>
    <div class="panel" id="panel"></div>

  </section>

  <aside class="stream">
    <h2>ledger
      <label class="toggle"><input type="checkbox" id="quiet" checked> decisions only</label>
    </h2>
    <div id="feed"></div>
  </aside>

</main>

<main class="config" id="config" hidden>
  <aside class="config-nav" id="config-nav"></aside>
  <aside class="config-list">
    <div class="search"><svg class="i"><use href="#i-search"/></svg>
      <input id="config-search" type="search" placeholder="filter" autocomplete="off"></div>
    <div id="config-items"></div>
  </aside>
  <section class="config-detail" id="config-detail"></section>
</main>

<svg hidden aria-hidden="true"><defs>
  <symbol id="i-runs" viewBox="0 0 16 16"><path d="M2 3h12M2 8h12M2 13h7"/></symbol>
  <symbol id="i-config" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M12.9 3.1l-1.4 1.4M4.5 11.5l-1.4 1.4"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></symbol>
  <symbol id="i-agents" viewBox="0 0 16 16"><circle cx="5.5" cy="5" r="2.2"/><circle cx="11.5" cy="5" r="2.2"/><path d="M1.5 13c0-2.2 1.8-3.6 4-3.6s4 1.4 4 3.6M10 9.5c2.2 0 4.5 1.3 4.5 3.5"/></symbol>
  <symbol id="i-prompts" viewBox="0 0 16 16"><path d="M3 1.5h6.5L13 5v9.5H3z"/><path d="M9.5 1.5V5H13M5.5 8h5M5.5 11h3.5"/></symbol>
  <symbol id="i-mcp" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/><path d="M7 4.5h3.5a1.5 1.5 0 011.5 1.5v3M4.5 7v3.5a1.5 1.5 0 001.5 1.5H9"/></symbol>
  <symbol id="i-models" viewBox="0 0 16 16"><path d="M8 1.5l6 3.2-6 3.2-6-3.2z"/><path d="M2 8l6 3.2L14 8M2 11.3l6 3.2 6-3.2"/></symbol>
  <symbol id="i-skills" viewBox="0 0 16 16"><path d="M8 1.5l1.9 4 4.4.6-3.2 3.1.8 4.3L8 11.5l-3.9 2 .8-4.3L1.7 6.1l4.4-.6z"/></symbol>
  <symbol id="i-hooks" viewBox="0 0 16 16"><path d="M11 2v6a3 3 0 01-6 0V6.5"/><circle cx="11" cy="2" r="1.2"/><path d="M3 6.5l2-2.2 2 2.2"/></symbol>
  <symbol id="i-guardrails" viewBox="0 0 16 16"><path d="M8 1.5l5 2v4.2c0 3.2-2.1 5.7-5 6.8-2.9-1.1-5-3.6-5-6.8V3.5z"/><path d="M5.8 8l1.5 1.6 3-3.4"/></symbol>
  <symbol id="i-modes" viewBox="0 0 16 16"><path d="M2 4.5h12M2 11.5h12"/><circle cx="5.5" cy="4.5" r="1.8"/><circle cx="10.5" cy="11.5" r="1.8"/></symbol>
  <symbol id="i-loops" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 11-1.8-4.1"/><path d="M13.8 1.5v3h-3"/></symbol>
  <symbol id="i-target" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r="0.6"/></symbol>
  <symbol id="i-settings" viewBox="0 0 16 16"><path d="M2 4.5h12M2 8h12M2 11.5h12"/><circle cx="5.5" cy="4.5" r="1.5"/><circle cx="10" cy="8" r="1.5"/><circle cx="6.5" cy="11.5" r="1.5"/></symbol>
</defs></svg>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <strong id="drawer-title">—</strong>
    <button id="drawer-close" aria-label="close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
