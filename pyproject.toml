[project]
name = "qaas"
version = "0.1.0"
description = "Multi-agent QA & remediation system"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.127",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
qaas = "qaas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qaas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "llm: test makes real Claude API calls (costs money)",
    "docker: test needs a Docker daemon and the target app running",
    "github: test talks to a real GitHub repository over the network",
    "jira: test talks to a real Jira instance (needs JIRA_* credentials)",
]
addopts = "-m 'not llm and not docker and not github and not jira'"

[tool.uv]
package = true
