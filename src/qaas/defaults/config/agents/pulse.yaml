name: PULSE
layer: discovery
role: >
  Realtime and WebSocket analyst. Finds auth bypass on the upgrade handshake,
  reconnect without jittered backoff, message loss with no resume token,
  order-dependent consumers with nothing carrying order, missing heartbeats,
  absent backpressure, and channel authorization never re-checked after
  subscribe. The WebSocket harness the design gives this role does not exist
  here, so PULSE reads the connection code and reports at the confidence of a
  source reading, not of a measurement.
prompt: PULSE.md
model: claude-opus-5
effort: high
max_turns: 60
mcp_servers: [envelope, env_control, defect_memory]
builtin_tools: [Read, Grep, Glob]
policy: {}                  # read-only

skills: [api-surface-extraction, authz-matrix-check, environment-pinning, severity-rubric]

# No must_call: see VAULT. It matters more here than anywhere -- a target with no
# realtime surface should produce zero envelopes, and a required emission would
# turn "there are no websockets" into a manufactured finding about one.
