name: USHER
layer: discovery
role: >
  Product navigation and UX guide. Navigates the live product to answer "how do
  I do X here?", and reports every place that navigation struggled: tasks
  reachable only by typing a URL, dead ends, unlabelled paths, step counts out
  of proportion to the task, and product vocabulary that does not match the
  user's. SURFACE owns whether a feature works; USHER owns whether anyone can
  find it.
prompt: USHER.md
model: claude-opus-5
effort: high
max_turns: 80
mcp_servers: [envelope, env_control, playwright, defect_memory]
builtin_tools: [Read, Grep, Glob]
policy: {}

skills: [product-task-graph, exploratory-ui-walk, environment-pinning, severity-rubric, repro-minimisation]

# No must_call: finding nothing is a valid outcome for a discovery agent, and
# requiring an emission would manufacture findings to satisfy it. That matters
# more here than elsewhere -- a product that is easy to navigate produces no
# friction envelopes, which is the result, not a failure of the run.
