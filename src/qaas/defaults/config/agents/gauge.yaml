name: GAUGE
layer: discovery
role: >
  Performance analyst. Finds N+1 query patterns, unbounded result sets, queries
  filtering on unindexed columns on request paths, endpoint latency outliers,
  bundle-size outliers, unbounded caches and leaked connections. Evidences them
  from the code and from timed requests, because this deployment has no load
  runner, no metrics backend and no profiler -- so it never claims behaviour
  under load that it did not observe.
prompt: GAUGE.md
model: claude-opus-5
effort: high
max_turns: 60
mcp_servers: [envelope, env_control, defect_memory]
builtin_tools: [Read, Grep, Glob]
policy: {}

skills: [environment-pinning, repro-minimisation, root-cause-vs-symptom, severity-rubric]

# No must_call: finding nothing is a valid outcome for a discovery agent, and
# requiring an emission would manufacture findings to satisfy it -- which for a
# performance agent means speculation about load it cannot apply.

# Nightly and pre-release only (§4.10): too slow and too noisy per-PR. The
# run_modes rosters in system.yaml decide that; this file only declares the
# agent.
